name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, types, tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy (strict)
        run: mypy
      - name: Tests with coverage
        run: pytest --cov=medallion --cov-report=term-missing --cov-fail-under=85

  specification:
    name: Specification, generated files and sample run
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e .
      - name: Lint the specification
        run: medallion lint --fail-on low --format markdown | tee lint.md
      - name: Publish lint summary
        if: always()
        run: cat lint.md >> "$GITHUB_STEP_SUMMARY"
      - name: Generated files are current
        run: medallion generate --check
      - name: Build the lakehouse from the sample data
        run: medallion run

  package:
    name: Wheel installs and runs on its own
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install build
          python -m build --wheel
      - name: Install the wheel into a clean environment and run it on a copy of the spec
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cp -r spec /tmp/spec
          cd "$(mktemp -d)"
          /tmp/clean/bin/medallion --version
          /tmp/clean/bin/medallion lint --spec /tmp/spec
          /tmp/clean/bin/medallion run --spec /tmp/spec

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e . pip-audit
      - name: pip-audit
        run: pip-audit --skip-editable
