# Generated by medallion from spec/. Do not edit by hand.
# Validate with: databricks bundle validate -t dev --var warehouse_id=<id>
bundle:
  name: retail-lakehouse
include:
  - "resources/*.yml"
variables:
  catalog:
    description: "Unity Catalog catalog for this target (set per target)"
  warehouse_id:
    description: "SQL warehouse that runs the governance task; pass with --var or BUNDLE_VAR_warehouse_id"
  run_as_service_principal:
    description: "Application ID of the service principal that runs staging and prod. Replace the placeholder."
    default: "00000000-0000-0000-0000-000000000000"
  schedule_status:
    description: "PAUSED or UNPAUSED; only prod is unpaused by default"
    default: PAUSED
targets:
  dev:
    mode: development
    default: true
    variables:
      catalog: retail_dev
  staging:
    mode: production
    workspace:
      root_path: "/Workspace/Shared/.bundle/${bundle.name}/${bundle.target}"
    run_as:
      service_principal_name: "${var.run_as_service_principal}"
    variables:
      catalog: retail_staging
  prod:
    mode: production
    workspace:
      root_path: "/Workspace/Shared/.bundle/${bundle.name}/${bundle.target}"
    run_as:
      service_principal_name: "${var.run_as_service_principal}"
    variables:
      catalog: retail_prod
      schedule_status: UNPAUSED
