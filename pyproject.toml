[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "databricks-medallion-lakehouse"
version = "0.1.0"
description = "A spec-driven medallion lakehouse for Databricks: table specs in, Lakeflow pipeline SQL, Unity Catalog governance and an asset bundle out."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Darshan Kumar Satpathy" }]
keywords = ["databricks", "lakehouse", "medallion", "unity-catalog", "lakeflow", "data-quality", "governance"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10", "pip-audit>=2.7", "pyyaml>=6.0"]

[project.scripts]
medallion = "medallion.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/medallion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::ResourceWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B011", "E501"]
"src/medallion/policy.py" = ["E501"]
"src/medallion/gen_sql.py" = ["E501"]
"src/medallion/gen_uc.py" = ["E501"]
"src/medallion/gen_bundle.py" = ["E501"]
"src/medallion/docs.py" = ["E501"]
# oracle.py splices spec expressions into SQLite statements by design. `medallion run` refuses to
# execute when the policy reports a finding at high or above (MED011, the portable expression
# subset, is critical). The specification is trusted input; see docs/oracle-assumptions.md.
"src/medallion/oracle.py" = ["E501", "S608"]
"src/medallion/cli.py" = ["E501"]
"src/medallion/spec.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["medallion"]

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true
